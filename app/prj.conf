# ── Stack ──────────────────────────────────────────────────────────────
# Eye rendering is iterative (no recursion). 4 KB is sufficient.
CONFIG_MAIN_STACK_SIZE=4096

# ── Logging ────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_WARN=y

# ── LVGL ───────────────────────────────────────────────────────────────
CONFIG_LVGL=y

# LVGL heap: canvas widget + screen + draw-task descriptors during rendering.
# The 128×128 pixel buffer (32 KB) is a static array — NOT from this heap.
# The canvas init uses memset() instead of lv_canvas_fill_bg() so the heap
# is only touched during draw-task execution in lv_timer_handler().
# 8 KB is sufficient for the draw pipeline with a minimal canvas-only UI.
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# VDB = the render buffer LVGL flushes to the display in strips.
# 5% of 160×160×2 bytes = 8 lines × 160 px × 2 bytes = 2560 bytes.
# Reduces RAM vs default 10% (~5.1 KB); 16 flush passes for 128 eye rows.
CONFIG_LV_Z_VDB_SIZE=5

CONFIG_LV_COLOR_DEPTH_16=y
# Swap RGB565 bytes so SPIM DMA sends them MSB-first to the GC9D01.
CONFIG_LV_COLOR_16_SWAP=y

# ── Display ────────────────────────────────────────────────────────────
CONFIG_DISPLAY=y
# Input subsystem is an LVGL dependency even without touch input.
CONFIG_INPUT=y

# ── GPIO (blink button) ────────────────────────────────────────────────
CONFIG_GPIO=y

# ── Random number generator (hardware TRNG on nRF52832) ───────────────
CONFIG_ENTROPY_GENERATOR=y

# ── Math (used by the eye renderer for integer arithmetic) ────────────
CONFIG_FPU=n
