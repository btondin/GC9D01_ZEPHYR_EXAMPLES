# Main application thread stack size in bytes.
# 4 KB is sufficient for LVGL callbacks, sensor reads, and logging.
CONFIG_MAIN_STACK_SIZE=4096

# Enable the Zephyr logging infrastructure (LOG_INF, LOG_ERR, LOG_WRN, etc.)
CONFIG_LOG=y

# Enable LVGL's internal logging system (routes messages to the Zephyr log)
CONFIG_LV_USE_LOG=y
# Only show warnings and errors — suppress verbose info/trace output
CONFIG_LV_LOG_LEVEL_WARN=y

# Enable the LVGL graphics library
CONFIG_LVGL=y
# LVGL heap size for dynamic widget and draw buffer allocation.
# 160×160 @ RGB565 framebuffer ≈ 51 KB; draw buffer (10%) ≈ 5 KB.
# 16 KB covers the draw buffer plus LVGL internal allocations for this demo.
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# Enable the Zephyr display driver API (used to control the GC9D01)
CONFIG_DISPLAY=y
# Enable the input subsystem (required as an LVGL dependency even without touch)
CONFIG_INPUT=y
# Enable the sensor driver API (used by the FXOS8700CQ accelerometer driver)
CONFIG_SENSOR=y
# Enable the device emulation layer (required by the NCS sensor subsystem)
CONFIG_EMUL=y

# Enable the I2C driver API (used to communicate with the FXOS8700CQ)
CONFIG_I2C=y

# Built-in LVGL fonts available for optional use in widgets
CONFIG_LV_FONT_MONTSERRAT_8=y  # Montserrat 8 px — small proportional font
CONFIG_LV_FONT_UNSCII_8=y     # UNSCII 8 px   — monospace bitmap font

# Enable floating-point support in the compact printf formatter (cbprintf).
# Required for lv_label_set_text_fmt() calls using %f / %.1f format specifiers.
CONFIG_CBPRINTF_FP_SUPPORT=y

# LVGL color depth: 16-bit RGB565 matches the GC9D01 pixel format in the overlay
CONFIG_LV_COLOR_DEPTH_16=y
# Swap the two bytes of each RGB565 pixel before sending to the display.
# Required because the nRF52832 is little-endian but the GC9D01 expects
# big-endian (MSB-first) pixel data over SPI.
CONFIG_LV_COLOR_16_SWAP=y
